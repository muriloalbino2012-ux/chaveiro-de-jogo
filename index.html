<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Mario World</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        // CONFIGURAÇÃO COMPLETA VIA CDN
        window.EJS_player = "#game";
        window.EJS_core = "snes";
        window.EJS_gameName = "Super Mario World";
        window.EJS_gameUrl = "data/Super Mario World (V1.0) (E).bin";
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_DEBUG_XX = false;

        // Carrega o loader diretamente da CDN
        (function() {
            const script = document.createElement("script");
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            script.onload = function() {
                console.log("EmulatorJS carregado com sucesso!");
            };
            script.onerror = function() {
                alert("Falha ao carregar o emulador. Verifique sua conexão com a internet.");
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
